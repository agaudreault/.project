# .project metadata for Argo
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project

schema_version: '1.0.0'
slug: 'argo'
name: 'Argo'
description: 'Kubernetes-native tools to run workflows, manage clusters, and do GitOps right.'
type: 'project'
slack_channels:
  - name: '#argo-announcements'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-announcements'
    primary: true
  - name: '#argo-cd'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-cd'
  - name: '#argo-events'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-events'
  - name: '#argo-rollouts'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-rollouts'
  - name: '#argo-workflows'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-workflows'
  - name: '#argo-cd-contributors'
    workspace: 'cncf'
    link: 'https://cloud-native.slack.com/messages/argo-cd-contributors'

maturity_log:
  - phase: 'incubating'
    date: '2020-03-26T00:00:00Z'
    issue: 'https://github.com/cncf/toc/pull/299'
  - phase: 'graduated'
    date: '2022-12-06T00:00:00Z'
    issue: 'https://github.com/cncf/toc/pull/604'

repositories:
  - url: 'https://github.com/argoproj/argoproj'
    primary: true
  - url: 'https://github.com/argoproj/argo-cd'
    tags: [core]
  - url: 'https://github.com/argoproj/argo-workflows'
    tags: [core]
  - url: 'https://github.com/argoproj/argo-events'
    tags: [core]
  - url: 'https://github.com/argoproj/argo-rollouts'
    tags: [core]
  - url: 'https://github.com/argoproj/argo-helm'
    tags: [packaging]

website: 'https://argoproj.github.io/'

artwork: 'https://landscape.cncf.io/logos/argo.svg'

# Using Argo CD project since it has the most adoption
adopters:
  path: 'https://github.com/argoproj/argo-cd/blob/master/USERS.md'

package_managers:
  docker: quay.io/argoproj
  helm: 'https://argoproj.github.io/argo-helm'

social:
  twitter: 'https://twitter.com/argoproj'
  linkedin: 'https://www.linkedin.com/company/argoproj'
  youtube: 'https://www.youtube.com/@argoproj7170'
  bluesky: 'https://bsky.app/profile/argoproj.io'

security:
  policy:
    path: 'https://github.com/argoproj/argoproj/blob/main/SECURITY.md'
  contact:
    advisory_url: 'https://github.com/argoproj/argoproj/blob/main/SECURITY.md#reporting-vulnerabilities'

governance:
  contributing:
    path: 'https://github.com/argoproj/argoproj/blob/main/community/CONTRIBUTING.md'
  code_of_conduct:
    path: 'https://github.com/cncf/foundation/blob/main/code-of-conduct.md'

legal:
  license:
    path: 'https://github.com/argoproj/argo-cd/blob/master/LICENSE'
  identity_type:
    has_dco: true # Argo requires DCO sign-off on all commits
    has_cla: false # No CLA; contributions are gated by DCO only
    dco_url:
      path: 'https://developercertificate.org/'

documentation:
  readme:
    path: 'https://github.com/argoproj/argoproj/blob/main/README.md'

landscape:
  category: 'App Definition and Development'
  subcategory: 'Continuous Integration & Delivery'

